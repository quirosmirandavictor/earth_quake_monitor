services:
  azurite:
    image: ${AZURITE_IMAGE}
    container_name: ${AZURITE_CONTAINER_NAME}
    environment:
      AZURITE_ACCOUNTS: "${AZURITE_ACCOUNT_NAME}:${AZURITE_ACCOUNT_KEY}"
    command: azurite --blobHost ${AZURITE_BIND_ADDRESS} --queueHost ${AZURITE_BIND_ADDRESS} --tableHost ${AZURITE_BIND_ADDRESS} --loose --skipApiVersionCheck
    ports:
      - "${AZURITE_BLOB_PORT}:${AZURITE_BLOB_PORT}"
      - "${AZURITE_QUEUE_PORT}:${AZURITE_QUEUE_PORT}"
      - "${AZURITE_TABLE_PORT}:${AZURITE_TABLE_PORT}"
    volumes:
      - azurite-data:/data
  functions:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ${FUNCTIONS_CONTAINER_NAME}
    dns:
      - 8.8.8.8
    depends_on:
      azurite:
        condition: service_started
    ports:
      - "${FUNCTIONS_HOST_PORT}:${FUNCTIONS_CONTAINER_PORT}"
    environment:
      FUNCTIONS_WORKER_RUNTIME: ${FUNCTIONS_WORKER_RUNTIME}
      EarthquakeIngestionSchedule: ${EARTHQUAKE_INGESTION_SCHEDULE}
      AzureWebJobsStorage: ${AZURE_WEBJOBS_STORAGE}
      ConnectionStrings__Oracle: ${ORACLE_CONNECTION_STRING}
      TNS_ADMIN: ${TNS_ADMIN_PATH}
      USGS__PageSize: ${USGS_PAGE_SIZE}
      USGS__InitialLookbackHours: ${USGS_INITIAL_LOOKBACK_HOURS}
      USGS__OverlapMinutes: ${USGS_OVERLAP_MINUTES}
      PublicApi__Key: ${PUBLIC_API_KEY}
      PublicApi__RequestsPerMinute: ${PUBLIC_API_REQUESTS_PER_MINUTE}
      AzureWebJobsSecretStorageType: files
    volumes:
      - ./secrets/oracle-wallet:${TNS_ADMIN_PATH}:ro
      - ./secrets/functions:/home/data/Functions/Secrets:ro
      - ./secrets/functions:/azure-functions-host/Secrets:ro
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ${FRONTEND_CONTAINER_NAME}
    depends_on:
      functions:
        condition: service_started
    ports:
      - "${FRONTEND_HOST_PORT}:5173"
    environment:
      EARTHQUAKE_API_URL: ${FRONTEND_API_URL}
      EARTHQUAKE_FUNCTION_KEY: ${EARTHQUAKE_FUNCTION_KEY:-}
      EARTHQUAKE_API_KEY: ${PUBLIC_API_KEY}
    volumes:
      - ./secrets/functions:/run/secrets/functions-keys:ro

volumes:
  azurite-data:
